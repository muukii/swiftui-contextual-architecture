appId: app.muukii.ModelArchitecture
name: Dispose during login and replace the whole Session on logout
---
- launchApp:
    clearState: true

- assertVisible: "Your Session already exists"
- tapOn: "Sign In"
- tapOn:
    id: "dispose-during-sign-in-button"
- assertVisible: "Closing Session .*"
- tapOn:
    id: "deliver-closing-callbacks-button"
- assertVisible: "No active Session selected"

- tapOn:
    id: "session-lab-button"
- tapOn:
    id: "create-session-button"
- tapOn: "Done"
- assertVisible: "Your Session already exists"
- tapOn: "Sign In"
- tapOn:
    id: "complete-sign-in-button"
- tapOn: "Continue"
- tapOn: "Finish Setup"
- tapOn: "Enter App"
- tapOn: "Account"
- tapOn:
    id: "logout-replace-button"
- assertVisible: "Your Session already exists"
- assertVisible: "Not signed in"
